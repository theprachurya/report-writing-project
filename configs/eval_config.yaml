# Evaluation configuration — docs/PROJECT_BRIEF.md Section 9.
# Test set is touched ONCE, at the end. Thresholds from validation only.

# ── Baselines to evaluate (Section 9.1) ──────────────────────────────────────
baselines:
  - name: "visual_only"
    id: 1
  - name: "audio_only"
    id: 2
  - name: "late_equal_logit_average"
    id: 3
  - name: "feature_concat_mlp"
    id: 4
  - name: "fixed_learned_global_weights"
    id: 5
  - name: "reliability_no_sync"
    id: 6
  - name: "reliability_no_quality"
    id: 7
  - name: "full_proposed"
    id: 8

# ── Degradation suite (Section 9.2) ──────────────────────────────────────────
degradation:
  video:
    crf_levels: [18, 28, 38]            # H.264 CRF values
    resize_resolutions: [720, 480, 360] # px height
    blur_sigma: [1.0, 2.0, 3.0]        # Gaussian blur sigma
    frame_drop_rate: [0.05, 0.10, 0.20]
  audio:
    awgn_snr_db: [20, 10, 0]           # Additive white Gaussian noise
    codec_resample: true
    lowpass_cutoff_hz: [4000, 2000, 1000]
    dropout_rate: [0.05, 0.10, 0.20]    # Packet-like dropout
  joint:
    enabled: true                       # Both modalities degraded
  missing_modality:
    zeroed_audio: true                  # Zero out audio features
    no_face_flag: true                  # Architecture-supported masking

# ── Metrics (Section 9.3) ────────────────────────────────────────────────────
metrics:
  primary: "roc_auc"
  discrimination:
    - "roc_auc"
    - "pr_auc"
    - "balanced_accuracy"
    - "f1"
    - "precision"
    - "recall"
    - "confusion_matrix"
  calibration:
    - "brier_score"
    - "ece"                             # 15 equal-mass bins
    - "nll"                             # Negative log-likelihood
  ece_bins: 15                          # Equal-mass bins for ECE

# ── Threshold selection ──────────────────────────────────────────────────────
threshold:
  source: "validation"                  # NEVER from test set
  method: "youden_j"                    # Youden's J statistic (sensitivity + specificity - 1)

# ── Bootstrap confidence intervals (Section 9.3) ─────────────────────────────
bootstrap:
  enabled: true
  n_iterations: 1000
  confidence_level: 0.95
  stratify_by: "source_identity"        # Stratified over source identities
  seeds: [42, 123, 7]                   # Three seeds for final contenders

# ── Calibration (Section 8, stage 7) ─────────────────────────────────────────
calibration:
  method: "temperature_scaling"
  fit_on: "validation"                  # Temperature chosen on validation ONLY
  report_raw_and_scaled: true           # Keep raw and calibrated metrics distinct

# ── Cross-manipulation (Section 9.2) ─────────────────────────────────────────
cross_manipulation:
  held_out_family: null                 # Set before training; e.g., "faceswap"
  report_per_family: true

# ── Cross-dataset (Section 9.2) ──────────────────────────────────────────────
cross_dataset:
  enabled: false                        # Only where modality labels/licenses compatible
  no_threshold_retuning: true           # AUROC with no threshold retuning

# ── Efficiency profiling (Section 9.3) ───────────────────────────────────────
efficiency:
  measure_params: true
  measure_checkpoint_size: true
  measure_peak_gpu_memory: true
  latency_percentiles: [50, 95]         # p50 and p95
  include_preprocessing: true           # Report separately and end-to-end
  hardware_name: null                   # Must be filled: e.g., "RTX 3060 6GB"

# ── Reliability diagnostics (Section 9.3) ────────────────────────────────────
reliability_diagnostics:
  report_mean_weights_by_degradation: true
  report_correlation_with_severity: true
  report_gate_entropy: true
  detect_collapse: true                 # Flag if w_v ≈ 1 or w_a ≈ 1 always
  collapse_threshold: 0.95             # Flag if max(w_v, w_a) > threshold
