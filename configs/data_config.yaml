# Data pipeline configuration — docs/PROJECT_BRIEF.md Section 6.
# All paths are user-provided; never hardcode or redistribute dataset files.

# ── Dataset paths (override via CLI or env) ─────────────────────────────────
datasets:
  fakeavceleb:
    root: "${FAKEAVCELEB_ROOT:-data/raw/FakeAVCeleb_v1.2}"  # Override via FAKEAVCELEB_ROOT env var
    role: "main_multimodal"            # Primary multimodal benchmark
  dfdc:
    root: "${DFDC_ROOT:-data/raw/dfdc}"  # Override via DFDC_ROOT env var
    role: "visual_transfer"            # Do NOT claim audio-deepfake unless audited

# Separate audio-only external evaluation set. It is deliberately excluded from
# the AV source table and all AV training loaders. Download when needed with
# scripts/download_mlaad_tiny.py; the default slice is German (external test).
external_datasets:
  mlaad_tiny:
    repo_id: "mueller91/MLAAD-tiny"
    revision: "9143e5ea709575ebab6bec52840a1043aada7bb1"
    root: "${MLAAD_TINY_ROOT:-data/raw/MLAAD-tiny}"
    role: "audio_only_cross_dataset_evaluation"
    language: "de"
    license: "CC-BY-NC-4.0 for generated audio; see original/LICENSE for M-AILABS audio"

# ── Video decode ─────────────────────────────────────────────────────────────
decode:
  target_fps: 25                       # Fixed decode frame rate
  window_duration_s: 2.0               # 2-second windows
  frames_per_window: 16                # 16 uniformly spaced face frames
  effective_visual_fps: 8              # 16 frames / 2 s

# ── Face extraction (Section 6, visual) ──────────────────────────────────────
face:
  detector: "opencv_haar"               # Offline OpenCV Haar baseline; alternate backends remain proposed
  box_expansion: 0.20                  # Expand detected box by 20%
  crop_size: 160                       # Output crop: 160×160 RGB
  min_valid_frames: 12                 # Window valid only if ≥12/16 faces detected
  align_by_landmarks: true             # Landmark-based alignment before crop

visual_normalization:
  mean: [0.485, 0.456, 0.406]           # ImageNet RGB mean for the configured CNN backbone
  std: [0.229, 0.224, 0.225]

quality_features:
  visual_dim: 7
  audio_dim: 5

# ── Audio extraction (Section 6, audio) ──────────────────────────────────────
audio:
  sample_rate: 16000                   # 16 kHz mono
  channels: 1
  peak_normalize: true                 # Normalize AFTER recording clipping stats
  vad_threshold: 0.30                  # Voice-activity fraction threshold; [Proposed]

# ── Log-Mel spectrogram ──────────────────────────────────────────────────────
mel:
  n_mels: 80                          # 80-bin log-Mel
  window_length_ms: 25                 # 25 ms STFT window
  hop_length_ms: 10                    # 10 ms hop
  f_min: 20.0                         # Hz
  f_max: 8000.0                        # Hz (Nyquist for 16 kHz)

# ── Temporal alignment ───────────────────────────────────────────────────────
alignment:
  temporal_bins: 8                     # T=8 bins per 2 s window
  embedding_dim: 256                   # Pool to one 256-D vector per bin

# ── Validity / missingness ───────────────────────────────────────────────────
validity:
  min_face_detection_rate: 0.75        # 12/16 frames
  min_vad_fraction: 0.10               # Minimum voice-activity fraction
  retain_invalid_with_flags: true      # Keep invalid windows with missingness flags

# ── Split ratios (Section 5.3) ───────────────────────────────────────────────
split:
  train: 0.70
  val: 0.10
  test: 0.20
  seed: 42                            # Split seed; manifests are versioned, not just seeded

# Seen-identity partition used after selecting a held-out manipulation family.
cross_manipulation_split:
  train: 0.75
  val: 0.10
  test_seen: 0.15

# ── Caching ──────────────────────────────────────────────────────────────────
cache:
  cache_dir: "data/cache"              # Precomputed crops and spectrograms
  enable_crop_cache: true
  enable_mel_cache: true
